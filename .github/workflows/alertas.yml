name: Alertas

on:
  # Dispara quando o CI termina, para reportar o resultado dos testes.
  # O workflow_run sempre roda a partir do branch padrao do repositorio.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Dispara na abertura e no merge de uma pull request.
  pull_request:
    types: [opened, closed]

jobs:
  notifica:
    name: Envia o alerta no Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Monta a mensagem
        id: mensagem
        env:
          EVENTO: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          CI_STATUS: ${{ github.event.workflow_run.conclusion }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMERO: ${{ github.event.number }}
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_ACAO: ${{ github.event.action }}
        run: |
          if [ "$EVENTO" = "workflow_run" ]; then
            if [ "$CI_STATUS" = "success" ]; then
              icone="✅"
              titulo="CI passou"
            else
              icone="❌"
              titulo="CI falhou ($CI_STATUS)"
            fi
            texto="$icone <b>$titulo</b>"$'\n'"repositorio: $REPO"$'\n'"branch: $CI_BRANCH"$'\n'"$CI_URL"
          elif [ "$PR_ACAO" = "opened" ]; then
            texto="🔀 <b>PR aberta</b> #$PR_NUMERO"$'\n'"$PR_TITULO"$'\n'"$PR_URL"
          elif [ "$PR_MERGED" = "true" ]; then
            texto="🎉 <b>PR mesclada</b> #$PR_NUMERO"$'\n'"$PR_TITULO"$'\n'"$PR_URL"
          else
            texto="🚫 <b>PR fechada sem merge</b> #$PR_NUMERO"$'\n'"$PR_TITULO"$'\n'"$PR_URL"
          fi

          {
            echo "texto<<FIM_DA_MENSAGEM"
            echo "$texto"
            echo "FIM_DA_MENSAGEM"
          } >> "$GITHUB_OUTPUT"

      - name: Envia para o Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # O texto chega por variavel de ambiente, e nao interpolado direto no
          # script. Ele carrega o titulo da PR, que e escrito por quem abre a
          # PR: interpolado, um titulo malicioso viraria comando no runner.
          TEXTO: ${{ steps.mensagem.outputs.texto }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Os secrets TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID precisam estar cadastrados no repositorio."
            exit 1
          fi

          # O --fail faz o curl retornar erro quando a API do Telegram recusa a
          # requisicao, para que o passo apareca como falha em vez de passar
          # silenciosamente com uma resposta de erro no corpo.
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=$TEXTO"
